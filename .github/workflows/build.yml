name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Also build on version tags → creates a GitHub Release with the APK attached
  release:
    types: [ created ]
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    # Expose whether a keystore secret exists as an env var usable in step conditions
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ─────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Gradle permissions ──────────────────────────────────────────────
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── 4. Build debug APK (every push) ────────────────────────────────────
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      # ── 5. Upload debug APK as build artifact ──────────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceNoteZA-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 6. Build release APK (unsigned — sign below if keystore provided) ──
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      # ── 7. Sign the release APK ─────────────────────────────────────────────
      #
      #  Add these secrets in GitHub → Settings → Secrets and variables → Actions:
      #    KEYSTORE_BASE64   → base64-encoded .jks file
      #                        (run: base64 -w 0 your-keystore.jks)
      #    KEY_STORE_PASSWORD → keystore password
      #    KEY_ALIAS          → key alias
      #    KEY_PASSWORD       → key password
      #
      - name: Sign release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      # ── 8. Upload signed release APK as artifact ────────────────────────────
      - name: Upload signed release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VoiceNoteZA-release-signed
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          retention-days: 90

      # ── 9. Attach APK to GitHub Release (when you create a tag release) ─────
      - name: Attach APK to GitHub Release
        if: github.event_name == 'release' && env.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.sign_app.outputs.signedReleaseFile }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 10. Fallback: attach unsigned APK to release if no keystore ──────────
      - name: Attach unsigned APK to Release (no keystore)
        if: github.event_name == 'release' && env.HAS_KEYSTORE != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
